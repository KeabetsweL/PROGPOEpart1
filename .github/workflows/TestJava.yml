name: QuickChat Java Tests

# Run automatically on pushes and pull requests.
# Also allow a manual run from GitHub's Actions tab.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Download the repository into the runner.
      - name: Check out source code
        uses: actions/checkout@v4

      # Match the Java release configured in pom.xml.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compile the application and run every JUnit test class.
      - name: Build and run all tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      # Preserve test reports even when a test fails.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn